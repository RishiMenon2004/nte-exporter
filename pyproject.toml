[project]
name = "nte-history-exporter"
version = "0.3.4"
description = "Cross-platform Neverness to Everness pull-history and achievement exporter."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
nte-history-exporter = "nte_history_exporter.cli:main"

[project.gui-scripts]
nte-history-exporter-gui = "nte_history_exporter.gui.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
