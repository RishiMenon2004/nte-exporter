name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,gui]"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: python -m PyInstaller --clean --noconfirm "packaging/NTE History Exporter.spec"

      - name: Smoke Test
        run: .\dist\nte-history-exporter.exe --help

      - name: Build GUI
        run: python -m PyInstaller --clean --noconfirm "packaging/NTE History Exporter GUI.spec"

      # The GUI exe is windowed (no console), so --smoke-test builds the window and
      # reports success through the exit code instead of printing anything.
      - name: Smoke Test GUI
        timeout-minutes: 2
        run: |
          $p = Start-Process -FilePath .\dist\nte-history-exporter-gui.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test exited with code $($p.ExitCode)" }

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows
          retention-days: 7
          path: |
            dist/nte-history-exporter.exe
            dist/nte-history-exporter-gui.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Install libpcap, the GUI's webview and a virtual display
        run: |
          sudo apt-get update
          # gir1.2-girepository-3.0: PyInstaller's GI hooks query modules through it. Without
          # it they bundle nothing for GLib/Gtk, and the build runs on PyGObject's raw API.
          sudo apt-get install -y libpcap-dev xvfb libgirepository-2.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1 gir1.2-girepository-3.0

      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,gui]"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: python -m PyInstaller --clean --noconfirm "packaging/NTE History Exporter.spec"

      - name: Smoke Test
        run: ./dist/nte-history-exporter --help

      - name: Build GUI
        run: python -m PyInstaller --clean --noconfirm "packaging/NTE History Exporter GUI.spec"

      - name: Smoke Test GUI
        timeout-minutes: 2
        run: xvfb-run -a ./dist/nte-history-exporter-gui --smoke-test

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux
          retention-days: 7
          path: |
            dist/nte-history-exporter
            dist/nte-history-exporter-gui

  build-macos:
    name: Build macOS
    runs-on: macos-15-intel

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build,gui]"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: python -m PyInstaller --clean --noconfirm "packaging/NTE History Exporter.spec"

      - name: Smoke Test
        run: ./dist/nte-history-exporter --help

      - name: Build GUI
        run: python -m PyInstaller --clean --noconfirm "packaging/NTE History Exporter GUI.spec"

      - name: Smoke Test GUI
        timeout-minutes: 2
        run: '"dist/NTE History Exporter.app/Contents/MacOS/nte-history-exporter-gui" --smoke-test'

      # Zip the .app here with ditto: artifact upload drops the executable bits and
      # symlinks a bundle needs, so it must travel already archived.
      - name: Archive GUI App
        run: ditto -c -k --keepParent "dist/NTE History Exporter.app" dist/nte-history-exporter-gui-macos.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos
          retention-days: 7
          path: |
            dist/nte-history-exporter
            dist/nte-history-exporter-gui-macos.zip
