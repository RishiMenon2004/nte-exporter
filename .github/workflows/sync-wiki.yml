name: Sync Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - README.md
      - tools/sync_wiki.py
      - .github/workflows/sync-wiki.yml

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Clone Wiki Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo; then
            echo "::error title=Wiki not initialized::Create the first page once at https://github.com/${{ github.repository }}/wiki/_new, then re-run this workflow."
            exit 1
          fi

      - name: Generate Wiki Pages
        run: python tools/sync_wiki.py --output wiki-repo --repo "${{ github.repository }}" --branch main

      - name: Commit and Push Wiki
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi
          git commit -m "docs: Sync wiki from main (${GITHUB_SHA::7})"
          git push origin HEAD
